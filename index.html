<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PartyBow Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid #333;
      width: 100%;
      max-width: 360px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      color: #00ffcc;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    p {
      color: #aaaaaa;
      font-size: 16px;
      margin: 0 0 24px;
    }
    button {
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.1s, background 0.2s;
    }
    button:active {
      transform: scale(0.96);
      background: #cc0044;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #888;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PartyBox Test</h1>
    <p>Подключение к Raspberry Pi Zero 2W успешно!</p>
    <button onclick="sendClick()">Нажми меня</button>
    <div id="status"></div>
  </div>

  <script>
    let clicks = 0;
    function sendClick() {
      clicks++;
      document.getElementById('status').innerText = `Кнопка нажата раз: ${clicks}`;
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }
    }
  </script>
</body>
</html>
