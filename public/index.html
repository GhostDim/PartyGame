<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf4ec">
  <title>PartyBox</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="page-player">
  <p id="conn" class="conn" hidden>Нет связи с консолью, переподключение…</p>
  <div class="wrap">
    <section id="view-boot" class="panel">
      <p class="brand">PartyBox</p>
      <h1>Подключение…</h1>
    </section>

    <section id="view-join" class="panel" hidden>
      <p class="brand">PartyBox</p>
      <h1>Как тебя зовут?</h1>
      <form id="join-form">
        <label for="nick">Имя</label>
        <input id="nick" name="nick" maxlength="16" autocomplete="nickname" required>
        <p class="label">Аватар</p>
        <div id="avatars" class="avatar-picker"></div>
        <p id="join-error" class="error" hidden></p>
        <button type="submit">Войти в лобби</button>
      </form>
    </section>

    <section id="view-lobby" class="panel" hidden>
      <header class="me">
        <span id="me-avatar" class="face"></span>
        <div>
          <strong id="me-name"></strong>
        </div>
      </header>
      <p id="wait-note" class="wait" aria-live="polite">Ожидание запуска игры ведущим...</p>
      <div id="games" class="game-list"></div>
    </section>

    <section id="view-play" class="panel" hidden>
      <div id="play-generic">
        <p class="brand">PartyBox</p>
        <h1 id="play-title">Игра началась</h1>
        <p id="play-note" class="wait">Кнопки раунда появятся на этом экране.</p>
      </div>
      <div id="play-bomb" hidden>
        <div id="bomb-chain" class="bomb-chain" aria-label="Очередь передачи"></div>
        <p id="bomb-count" class="bomb-count" aria-live="assertive" hidden></p>
        <p id="bomb-status" class="bomb-status" aria-live="polite"></p>
        <p id="bomb-score" class="bomb-hero-score" hidden></p>
        <button id="bomb-pass" class="bomb-pass" type="button" hidden>ПЕРЕДАТЬ</button>
        <div id="bomb-winners" class="bomb-winners" hidden></div>
      </div>
      <div id="play-quiz" hidden>
        <div class="quiz-head">
          <p id="quiz-kicker" class="quiz-kicker"></p>
          <p id="quiz-score" class="quiz-score"></p>
          <p id="quiz-clock" class="quiz-clock" hidden></p>
        </div>
        <div id="quiz-bar" class="quiz-bar" hidden><span></span></div>
        <p id="quiz-count" class="bomb-count" aria-live="assertive" hidden></p>
        <p id="quiz-text" class="quiz-text"></p>
        <div id="quiz-options" class="quiz-options"></div>
        <div id="quiz-swipe" hidden>
          <p id="quiz-card" class="quiz-card"></p>
          <div class="quiz-ways">
            <button id="quiz-up" type="button"></button>
            <button id="quiz-down" type="button"></button>
          </div>
        </div>
        <div id="quiz-bet" hidden>
          <p id="quiz-bet-have"></p>
          <input id="quiz-bet-range" type="range" min="0" max="0" value="0" step="1" aria-label="Ставка">
          <p id="quiz-bet-value" class="quiz-score"></p>
          <div class="quiz-presets">
            <button type="button" data-bet="0">Ничего</button>
            <button type="button" data-bet="half">Половина</button>
            <button type="button" data-bet="all">Всё</button>
          </div>
          <button id="quiz-bet-lock" type="button">Поставить</button>
        </div>
        <p id="quiz-note" class="quiz-note" aria-live="polite"></p>
        <p id="quiz-ready" class="quiz-ready" hidden></p>
        <div id="quiz-podium" class="bomb-winners quiz-podium" hidden></div>
      </div>
    </section>
  </div>
  <button id="open-rank" class="fab fab-rank" type="button" hidden aria-label="Кубки">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h3a1 1 0 0 1 1 1v2a5 5 0 0 1-4.1 4.9A5 5 0 0 1 13 16.9V19h3v2H8v-2h3v-2.1a5 5 0 0 1-3.9-3.9A5 5 0 0 1 3 8V6a1 1 0 0 1 1-1h3V3zm10 4h2v1a3 3 0 0 1-2 2.8V7zM5 7h2v3.8A3 3 0 0 1 5 8V7z"/></svg>
  </button>
  <button id="open-settings" class="fab fab-settings" type="button" hidden aria-label="Настройки">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.8 7.8 0 0 0 .1-1 7.8 7.8 0 0 0-.1-1l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.4a.5.5 0 0 0-.6-.2l-2.5 1a7 7 0 0 0-1.7-1L14.6 2a.5.5 0 0 0-.5-.4h-4.2a.5.5 0 0 0-.5.4l-.3 2.6a7 7 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.4a.5.5 0 0 0 .1.6L4.5 11a7.8 7.8 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.4a.5.5 0 0 0 .6.2l2.5-1a7 7 0 0 0 1.7 1l.3 2.6a.5.5 0 0 0 .5.4h4.2a.5.5 0 0 0 .5-.4l.3-2.6a7 7 0 0 0 1.7-1l2.5 1a.5.5 0 0 0 .6-.2l2-3.4a.5.5 0 0 0-.1-.6L19.4 13zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg>
  </button>
  <dialog id="rank-sheet" class="sheet">
    <h2>Кубки</h2>
    <ol id="rank-list" class="player-list"></ol>
    <button id="rank-close" class="ghost" type="button">Закрыть</button>
  </dialog>
  <dialog id="player-settings" class="sheet">
    <h2>Настройки</h2>
    <label class="toggle">
      <input id="vibrate-toggle" type="checkbox">
      <span class="toggle-ui"></span>
      <span>Вибрация при нажатии</span>
    </label>
    <p id="vibrate-hint" class="muted" hidden></p>
    <button id="leave-btn" class="danger" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5v-2H5V5h5V3zm4.3 4.3 1.4 1.4L13.4 11H21v2h-7.6l2.3 2.3-1.4 1.4L9.6 12l4.7-4.7z"/></svg>
      Выйти из игры
    </button>
    <div id="leave-confirm" hidden>
      <p class="wait">Забыть это устройство и выйти? Войти можно будет заново.</p>
      <button id="leave-yes" class="danger" type="button">Да, выйти</button>
      <button id="leave-no" class="ghost" type="button">Остаться</button>
    </div>
    <button id="settings-close" class="ghost" type="button">Закрыть</button>
  </dialog>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script src="/bomb.js"></script>
  <script src="/quiz.js"></script>
  <script src="/player.js"></script>
</body>
</html>
